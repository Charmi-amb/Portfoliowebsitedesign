<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>charmi-amb.es — Próximamente</title>
  <meta name="description" content="Estamos preparando el nuevo sitio de charmi-amb.es. Muy pronto disponible.">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Dela+Gothic+One&family=Anton&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f3ee;
      --ink: #262220;
      --muted: #8a7f6f;
      --muted-2: #55493f;
      --line: #c9bfaf;
      --dot: #d9cfc0;
      --accent: #E70059;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
    }
    a { color: inherit; text-decoration: none; }

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(28px, 5vw, 72px) clamp(20px, 7vw, 96px);
      overflow: hidden;
    }

    .texture {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, var(--dot) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.35;
      pointer-events: none;
    }

    header {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      letter-spacing: 0.06em;
      color: var(--muted);
      flex-wrap: wrap;
      gap: 8px;
    }
    header .domain { text-transform: uppercase; }

    main {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: clamp(16px, 3vw, 28px);
      max-width: 900px;
      margin: 48px 0;
    }

    .kicker {
      font-family: 'Dela Gothic One', sans-serif;
      font-size: clamp(34px, 8vw, 68px);
      line-height: 1;
      color: #000;
    }

    h1 {
      margin: 0;
      font-family: 'Anton', sans-serif;
      font-weight: 400;
      text-transform: uppercase;
      font-size: clamp(44px, 10vw, 104px);
      line-height: 0.98;
      letter-spacing: 0.01em;
      color: var(--accent);
    }

    .rule {
      width: 64px;
      height: 5px;
      background-color: var(--accent);
    }

    p.message {
      margin: 0;
      font-size: clamp(16px, 2.4vw, 19px);
      line-height: 1.6;
      color: var(--muted-2);
      max-width: 560px;
    }

    footer {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 16px;
    }

    .contact-label {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .contact-email {
      font-size: 17px;
      color: var(--ink);
      border-bottom: 1px solid var(--line);
      padding-bottom: 2px;
      width: fit-content;
      display: inline-block;
    }

    .copyright {
      font-size: 13px;
      color: #a89d8c;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="texture"></div>

    <header>
      <div class="domain">charmi-amb.es</div>
      <div>Coming soon</div>
    </header>

    <main>
      <div class="kicker">すぐ</div>
      <h1>Próximamente...</h1>
      <div class="rule"></div>
      <p class="message">
        Estoy trabajando actualmente en que este sea un sitio estiloso y pulido,
        mientras tanto recuerda beber mucha agua.
      </p>
    </main>

    <footer>
      <div>
        <div class="contact-label">Contacto</div>
        <a class="contact-email" href="mailto:amb.charmi@gmail.com">amb.charmi@gmail.com</a>
      </div>
      <div class="copyright">© 2026 — Todos los derechos reservados</div>
    </footer>
  </div>
</body>
</html>
